services:
  - type: web
    name: voxentra
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
